  text: 17. Pinned choices and prohibited changes
  type: scientific_question
- item_id: PROH-007
  source_location: para 86
  text: Sniff onset threshold_std = −0.5 (pinned; no change without separate human
    sign-off).
  type: prohibition
- item_id: RQ-040
  source_location: para 87
  text: 'Multitaper: 4-s windows, 50% overlap, 7 Slepian tapers (NW = 4); frequency
