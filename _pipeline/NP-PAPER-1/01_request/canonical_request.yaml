- item_id: RQ-034
  source_location: para 67
  text: 'Methods figures:'
  type: scientific_question
- item_id: OUT-019
  source_location: para 68
  text: FIG-PAPER1-TRACES (Figure 1A analogue). For a representative experiment and
    a representative control segment, the SNF signal on top and, for each of the five
