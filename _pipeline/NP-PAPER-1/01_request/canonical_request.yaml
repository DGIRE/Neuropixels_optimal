  type: requested_output
- item_id: OUT-022
  source_location: para 71
  text: 14. Deliverable B — Results report and figures
  type: requested_output
- item_id: OUT-023
  source_location: para 72
  text: 'Produce a separate Results report (.docx) answering the two questions. It
    must report: the per-depth theta-coherence strength (mean ± SEM across experiments);
    the best depth per experiment and overall, with the consistency counts; and the
    varies-by-depth tests (mixed-effects LRT and Friedman, exact p and effect sizes;
    Holm-corrected post-hoc pairs if the omnibus is significant). Results figures:'
  type: requested_output
- item_id: DATA-001
  source_location: para 73
  text: FIG-PAPER1-PSD (Figure 1B analogue). LFP power spectral density overlaid for
    the five depths (grand mean ± SEM across experiments), with theta/beta/gamma bands
    marked.
  type: data_source
- item_id: OUT-024
  source_location: para 74
  text: FIG-PAPER1-COH (Figure 1C-bottom / 1E analogue; KEY). The LFP–sniff coherence
    spectrum for each of the five depths (grand mean ± SEM across experiments), with
    the 95% circular-shift null threshold drawn as a red dotted line and the theta
    band shaded. This figure shows directly which depth has the strongest theta coherence.
  type: requested_output
- item_id: OUT-025
  source_location: para 75
  text: 'FIG-PAPER1-DEPTH-SUMMARY (the requested summary figure; HEADLINE). Sniff-alignment
    strength (mean theta coherence) as a function of depth (ycoord µm / ordinal 1–5):
    per-experiment points plus grand mean ± SEM, with the best-aligned depth marked.
    Annotate the omnibus test result (does alignment vary by depth) and identify the
    depth with the strongest coherence to sniffing. A companion panel shows the significant-theta-fraction
    by depth.'
  type: requested_output
- item_id: RQ-035
  source_location: para 76
  text: 15. Result objects to emit
  type: scientific_question
- item_id: RQ-036
  source_location: para 78
  text: 16. New analysis functions and how to validate them
  type: scientific_question
- item_id: CON-005
  source_location: para 79
  text: 'The loader, sniff detection (compute_sniff_phase), and probe geometry are
    existing validated kernel functions. The spectral machinery is new and must be
    implemented and validated through the normal workflow (oracle-designer → analysis-implementer
    → numeric gate → independent re-derivation), not hand-waved. The new pieces are:
    (a) full-duration LFP extraction for selected channels (Section 4); (b) multitaper
    power spectrum and LFP–sniff coherence (Section 8); (c) the circular-shift null
    and percentile significance (Section 9); (d) the per-depth theta-coherence reduction
    and the depth statistics (Sections 10–12).'
  type: constraint
- item_id: RQ-037
  source_location: para 80
  text: 'Validation / grounding:'
  type: scientific_question
- item_id: OUT-026
  source_location: para 81
  text: 'Full-duration LFP: must match the current 10-s loader output channel-for-channel
    on the overlapping first 10 s (regression anchor).'
  type: requested_output
- item_id: DATA-002
  source_location: para 82
  text: 'Multitaper spectra and coherence: validate against an independent reference
    on a fixed synthetic fixture (two signals with known coherence, e.g. a common
    oscillation plus independent noise) and against SciPy/`nitime`-style multitaper
    on the same input; the paper''s own reference implementation (github.com/Sid-Rafilson-1617/sniff-LFP)
    may seed the oracle. Numeric tolerance: coherence and PSD within rtol 1e-6 / atol
    1e-9 on the fixture slice.'
  type: data_source
- item_id: RQ-038
  source_location: para 83
  text: 'Circular-shift null: reproducible bit-for-bit given seed 5489; the significance
    decision (exceeds/does-not-exceed the 95% threshold) is the accepted comparison
    at the workload level.'
  type: scientific_question
- item_id: CON-006
  source_location: para 84
  text: 'Depth statistics: the mixed-effects and Friedman decisions reproduce on re-run;
    effect sizes within tolerance.'
  type: constraint
- item_id: RQ-039
