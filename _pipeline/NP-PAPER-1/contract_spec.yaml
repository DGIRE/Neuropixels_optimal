# Contract spec for NP-PAPER-1 — authored from "NP-PAPER-1.docx"
# (canonical_request.yaml: REQ-NP-PAPER-1), per Blueprint v2 P2 / D9.
#
# Scope:
#  * Per-depth replication of Rafilson et al. (2024) Figure 1: LFP-sniff
#    spectral coherence computed independently at five evenly-spaced depths
#    along the Neuropixels probe, across 6 ethanol-experiment sessions
#    RESTRICTED TO CONTROL (non-ethanol) epochs.
#  * Two scientific questions: (Q1) which depth has the strongest theta-band
#    (2-12 Hz) LFP-sniff coherence [confirmatory measure], and (Q2) whether
#    alignment varies systematically with depth [exploratory characterization],
#    tested with a linear mixed-effects LRT (primary) + Friedman (confirmatory)
#    across the 6 experiments x 5 depths, with Holm-corrected Wilcoxon post-hoc.
#  * TWO docx report deliverables: Deliverable A (Methods/QC report + 3 methods
#    figures) and Deliverable B (Results report + 3 results figures).
#  * Reuses validated kernel functions load_experiment_data and
#    compute_sniff_phase; reuses the NP-DEMO-3 detect_eth_contact threshold RULE
#    verbatim for control-epoch masking.
#  * Additive, validated full-duration LFP extraction is the ONLY carve-out to
#    the kernel (PROH-010); no kernel numerics / Golden Fixtures / tolerance
#    config are edited.
#
# Scientific status (RQ-050 / PROH-006): the coherence computation is a
# CONFIRMATORY replication of a published method; the depth-dependence question
# is EXPLORATORY characterization (avoid causal / over-definitive language).
#
# Risk tier: RED (raw Neuropixels recordings + new spectral-coherence code).
# Opus requested for this contract per policy.

task_id: NP-PAPER-1
contract_version: 1

analysis:
  scientific_question:
    description: >-
      Across the olfactory-bulb Neuropixels probe, (Q1) which recording depth
      best aligns the LFP to sniffing -- i.e. which of five evenly-spaced depths
      has the strongest theta-band (2-12 Hz) LFP-sniff spectral coherence, the
      paper's measure of alignment -- and (Q2) does the strength of that
      alignment vary systematically with depth across experiments? A per-depth
      replication of Rafilson et al. (2024), Figure 1, computed on control
      (non-ethanol) epochs only.
    docx_source_refs: [OUT-001, OUT-002, RQ-002, OUT-003, RQ-025, RQ-026, RQ-029]

  status: mixed  # confirmatory coherence replication + exploratory depth-dependence
  risk: red
  # Risk justification: raw Neuropixels recordings; NEW spectral-coherence
  # kernel (multitaper PSD + coherence, circular-shift null, per-depth
  # reduction, mixed-effects/Friedman depth statistics) with no validated
  # precedent; a required additive change to the validated LFP loader
  # (full-duration extraction); multi-figure, multi-document deliverable;
  # inferential repeated-measures statistics across 6 experiments x 5 depths.
  # Red tier warranted; Opus requested for contract design/review (RQ-049).

  scientific_status_split:
    confirmatory:
      description: >-
        The spectral machinery -- multitaper LFP power spectrum, SNF power
        spectrum, LFP-sniff coherence, and the circular-shift significance null
        -- is a confirmatory replication of the published Rafilson et al. (2024)
        Figure 1 method. Parameters are pinned by the request verbatim and are
        NOT to be tuned.
      docx_source_refs: [RQ-050, PROH-006, OUT-003, OUT-004, OUT-009, CON-003]
    exploratory:
      description: >-
        The depth-dependence question (which depth aligns best; does alignment
        vary by depth) is exploratory characterization. Report exact p-values
        and effect sizes; avoid causal or over-definitive language.
      docx_source_refs: [RQ-050, PROH-006, RQ-029, OUT-014, OUT-015, OUT-016]

  experimental_structure:
    description: >-
      Six recording sessions under the data root (2021-11-01, 2021-11-03,
      2021-12-15, 2022-05-17, 2022-06-24, 2022-09-14), each treated as one
      independent experiment and the animal-level unit of analysis (CON-001).
      Each of these six sessions was confirmed by David Gire (2026-07-23,
      NP-DEMO-4 OPEN-007) to correspond to a distinct animal -- the identical
      six dates -- so DATA-003's shared-animal contingency does NOT apply:
      experiment == session == animal (1:1), and session is the correct
      random-effect grouping (no nesting correction). Within each experiment the
      five depths are measured on the same time windows, so the design is
      repeated-measures (within-experiment) across depths: up to 6 experiments x
      5 depths = 30 per-experiment x per-depth mean theta-coherence values,
      fewer if a session is excluded per PROH-002/CON-008.
    docx_source_refs: [CON-001, DATA-003, DATA-004, CON-004, CON-009, CON-010, CON-011, CON-012, CON-013, CON-014]

  inputs:
    - {object: D-dict, from: load_experiment_data, fields: [LFP, LFP_t, LFP_Fs, NP_Fs, SNF, ETH, LV_Fs, xcoords, ycoords], docx_source_refs: [RQ-011, RQ-052, RQ-053, RQ-054, RQ-055, RQ-056, RQ-057, RQ-058]}
    - {object: LFP, description: "The neural signal (channels x samples @ LFP_Fs ~1000 Hz). One channel = one depth. Validated preprocessing: order-4 Butterworth low-pass at 400 Hz on native signal, then decimation to 1000 Hz. Requires full-duration extraction (see new function extract_full_lfp) for the five selected channels only.", docx_source_refs: [RQ-053, RQ-054, OUT-005]}
    - {object: SNF, description: "Raw sniff-sensor (cannula pressure) trace (n,) @ LV_Fs ~125 Hz. The respiratory reference for coherence (the paper's thermistor analogue). Used RAW (resampled to LFP rate) for coherence/PSD; NOT the detected phase (PROH-009). Also the source signal for compute_sniff_phase onset/valid-sniff detection.", docx_source_refs: [RQ-055, PROH-009, OUT-008]}
    - {object: ETH, description: "Ethanol sensor trace (n,) @ LV_Fs. Used ONLY to define control epochs: mean-subtract the entire trace, mark ethanol wherever mean-subtracted > 0.05 (control at/below). Fixed rule, no per-experiment adjustment.", docx_source_refs: [CON-015, PROH-003, PROH-008]}
    - {object: LV_Fs, description: "Sampling rate of SNF/ETH (~125 Hz); SNF/ETH/LFP share the recording clock.", docx_source_refs: [RQ-056, PROH-005]}
    - {object: xcoords/ycoords, description: "Probe channel geometry (nCh,) in um; ycoord = position along the probe. Basis for the deterministic five-depth selection. All fields already validated in the kernel.", docx_source_refs: [RQ-057, RQ-012]}
    - {object: NP_Fs, description: "Native Neuropixels sample rate; used when re-deriving LFP for the full duration (extract_full_lfp).", docx_source_refs: [RQ-058, OUT-005]}

  required_validated_functions:
    - {name: load_experiment_data, module: "Optimized Python/load_experiment_data.py", usage: "Standard D-dict loader providing LFP/LFP_t/LFP_Fs/NP_Fs/SNF/ETH/LV_Fs/xcoords/ycoords. Reused as-is; NOT edited. The additive full-duration LFP extraction (extract_full_lfp) preserves this loader's validated preprocessing (order-4 Butterworth LP @ 400 Hz -> decimate to 1000 Hz, constants LFP_LP_HZ=400.0, LFP_OUT_FS=1000.0) exactly.", docx_source_refs: [RQ-011, OUT-005, RQ-054, PROH-010]}
    - {name: compute_sniff_phase, module: "Optimized Python/analyses/compute_sniff_phase.py", usage: "Reused VERBATIM at the pinned default threshold_std=-0.5 (PROH-007; never adjusted without separate human sign-off). Provides sniff_onsets_s (inhalation onset times, s), sniff_dur_s, and SNF_PH (per-sample phase 0..1; -1 marks noise / outside-cycle spans). sniff_onsets_s -> inter-sniff intervals -> instantaneous sniff rate; SNF_PH==-1 spans -> invalid-sniff (noise) sections.", docx_source_refs: [PROH-004, PROH-007, RQ-019, RQ-021]}
    - {name: detect_eth_contact, module: "_pipeline/NP-DEMO-3/03_software/detect_eth_contact.py", usage: "Reuse the NP-DEMO-3 validated ethanol-detection RULE verbatim (eth_threshold=0.05, mean-subtract ENTIRE ETH trace, mark ETH_ms > 0.05 = ethanol; at/below = control; no per-experiment adjustment). Provides eth_contact_mask at LV_Fs. NOTE: this task needs a WINDOW-LEVEL control mask on the LFP clock, not the contact-run count, so a thin new deterministic wrapper (build_window_control_mask) consumes eth_contact_mask -- the thresholding rule itself is reused unchanged (PROH-003/PROH-008).", docx_source_refs: [PROH-003, PROH-008, CON-002]}

  new_kernel_functions_required:
    - name: extract_full_lfp
      proposed_signature: "extract_full_lfp(files, channel_indices, checkpoint_dir=None)"
      algorithm: >-
        Additive extension of the validated LFP path (does NOT edit
        load_experiment_data.py or its constants). Extract the LFP for ONLY the
        five selected channel_indices across the FULL recording duration
        (co-extensive with SNF/ETH), rather than the current hard-coded
        LFP_LOAD_SECS=10 s window. Preserve the validated preprocessing exactly:
        order-4 Butterworth low-pass at LFP_LP_HZ=400.0 Hz on the native signal
        (scipy.signal.butter(4, 400/(NP_Fs/2), btype='low')), then decimate to
        LFP_OUT_FS=1000.0 Hz. Return the full-duration LFP (5 x nSamples float64)
        plus LFP_t and LFP_Fs. Loading only the five selected channels at full
        duration (not all 384) is acceptable and preferred for memory (OUT-005).
      status: >-
        NEW additive kernel function. Must be authored, code-reviewed, and
        regression-gated before P3. Regression anchor (OUT-026): the extended
        LFP restricted to the first 10 s MUST equal the current 10-s loader
        output channel-for-channel within float64 numerical tolerance.
      docx_source_refs: [OUT-005, RQ-054, RQ-058, OUT-026, PROH-010]
    - name: select_five_depths
      proposed_signature: "select_five_depths(xcoords, ycoords, valid_lfp_channels)"
      algorithm: >-
        Deterministic, level-1 selection built only on the already-validated
        xcoords/ycoords fields. (1) Among channels that have BOTH a valid LFP row
        and a ycoord, take min and max ycoord (the recording extent). (2) Define
        five target positions at fractions 0.00, 0.25, 0.50, 0.75, 1.00 of
        (max - min) ycoord. (3) For each target, select the channel whose ycoord
        is nearest; on ties (equal |ycoord - target|), take the LOWER channel
        index. Because Neuropixels channels that share a ycoord differ only in
        column (xcoord) and tie in ycoord-distance, the lower-index tie-break
        deterministically fixes a single column throughout, satisfying RQ-016's
        "keep a single fixed column" note without an additional free choice.
        (4) Label Depth 1..Depth 5 ordered from the probe TIP (deepest inserted
        site) to the most superficial site. Emit, per experiment, each depth's
        channel index and its ycoord (um).
      status: NEW deterministic logic; no validated precedent. Level-1 (exact) acceptance.
      docx_source_refs: [RQ-012, RQ-013, RQ-014, RQ-015, RQ-016, OUT-006, OUT-007]
    - name: build_window_control_mask
      proposed_signature: "build_window_control_mask(D, window_starts, window_len_s)"
      algorithm: >-
        Thin deterministic wrapper. (1) Obtain the per-LV-sample ethanol mask via
        detect_eth_contact (mean-subtract entire ETH; ETH_ms > 0.05 = ethanol),
        reusing that rule verbatim. (2) Map the LV-rate mask to the LFP clock on
        the shared recording clock. (3) For each 4-s analysis window, mark it
        control ONLY IF it contains ZERO ethanol samples (any ethanol sample
        excludes the whole window). Also log total ethanol time excluded per
        experiment. No thresholds are introduced or tuned here.
      status: NEW deterministic wrapper over the reused detect_eth_contact rule.
      docx_source_refs: [PROH-003, PROH-008, CON-002]
    - name: build_valid_sniff_mask
      proposed_signature: "build_valid_sniff_mask(D_with_phase)"
      algorithm: >-
        From compute_sniff_phase output. (1) Inhalation times = sniff_onsets_s;
        inter-sniff interval (ISI) = successive-onset differences; instantaneous
        sniff rate = 1/ISI assigned to each between-onset interval. (2) Following
        the paper, mark spans whose ISI is below the 5th percentile OR above the
        95th percentile of THIS experiment's ISI distribution as invalid-sniff
        (non-physiological). (3) Additionally mark as invalid-sniff any span where
        SNF_PH == -1 (the detector's noise / non-sniff sentinel, analogue of the
        phase-locking tasks' spike_SNF_PH=-1). Output: per-sample valid-sniff mask
        (LFP clock) + retained instantaneous sniff-rate series for the Fig 1C/1D
        overlays.
      status: NEW deterministic logic over validated compute_sniff_phase outputs.
      docx_source_refs: [RQ-018, RQ-019, RQ-020, RQ-021, OUT-008]
    - name: resample_snf_to_lfp
      proposed_signature: "resample_snf_to_lfp(SNF, LV_Fs, LFP_Fs, n_lfp_samples)"
      algorithm: >-
        Resample the RAW SNF trace from LV_Fs (~125 Hz) up to the LFP rate
        (~1000 Hz) on the shared loader clock so LFP and SNF share a common time
        base for coherence. Use polyphase or band-limited interpolation. Theta
        (2-12 Hz) sits far below the SNF Nyquist (~62 Hz), so upsampling
        introduces no aliasing and does not affect the theta-band result. The
        detected phase is NEVER substituted for the raw SNF here (PROH-009).
      status: NEW deterministic resampling.
      docx_source_refs: [PROH-005, PROH-009, RQ-044]
    - name: multitaper_psd_coherence
      proposed_signature: "multitaper_psd_coherence(lfp_ch, snf_lfp_rate, control_valid_windows, fs=1000.0)"
      algorithm: >-
        Per the paper (RQ-040). Tile each recording into 4-s windows with 50%
        overlap; keep only windows that are all-control AND all-valid-sniff. In
        each retained window compute multitaper (Thomson) estimates with 7
        Slepian tapers, time-bandwidth product NW=4 (K = 2*NW-1 = 7; half-
        bandwidth ~1 Hz); report frequencies from the 4-s lower bound 0.25 Hz
        upward. Per window compute the LFP power spectrum S1(f), the SNF power
        spectrum S2(f), the cross-spectrum S12(f), and the coherence
        C(f) = |S12(f)| / sqrt( S1(f) * S2(f) ) exactly as written in RQ-023
        (transcribed verbatim). Aggregate across retained windows to per-
        experiment x depth LFP PSD, SNF PSD (depth-independent), and coherence
        spectra; also retain per-window time-resolved spectrograms/coherence for
        the Fig 1C heatmaps with sniff-rate overlay.
      status: >-
        NEW. Validate against an independent reference on a fixed synthetic
        fixture (two signals with known coherence: common oscillation + independent
        noise) and against SciPy/nitime-style multitaper on the same input; the
        paper's reference implementation (github.com/Sid-Rafilson-1617/sniff-LFP)
        may seed the oracle. Numeric tolerance rtol 1e-6 / atol 1e-9 on the
        fixture slice (DATA-002).
      docx_source_refs: [OUT-009, RQ-022, RQ-023, RQ-040, OUT-010, RQ-060, RQ-061, RQ-062, DATA-002]
    - name: circular_shift_null
      proposed_signature: "circular_shift_null(lfp_ch, snf_lfp_rate, control_valid_windows, n_shifts=1000, seed=5489)"
      algorithm: >-
        Establish significance exactly as the paper does (CON-003). Build a null
        coherence distribution by circularly shifting the SNF signal relative to
        the LFP and recomputing the windowed coherence; perform >=1000
        pseudo-random circular shifts. At each frequency, the 95th percentile of
        the null coherence is the significance threshold (Fig 1E red dotted line),
        and the observed coherence is reported as its percentile within the null.
        Pin the RNG seed to 5489 (lab convention) so the null -- and every
        significance decision -- is bit-for-bit reproducible. A depth's coherence
        at a frequency is "significant" when it exceeds the 95% null threshold
        there. The exact circular-shift offset sampling (seeded RNG, uniform over
        the valid shift range) follows the paper's reference implementation; the
        seeded generator makes it fully reproducible.
      status: >-
        NEW. Acceptance: bit-for-bit reproducible given seed 5489 (level 1 on
        re-run); the significance DECISION (exceeds / does-not-exceed the 95%
        threshold) is the accepted comparison at the workload level (RQ-038).
      docx_source_refs: [RQ-024, CON-003, RQ-041, RQ-038, RQ-008]
    - name: reduce_theta_coherence
      proposed_signature: "reduce_theta_coherence(coh_f, freqs, null_threshold_f)"
      algorithm: >-
        Reduce each per-experiment x depth coherence spectrum to the scalar
        alignment measures (Table 4): PRIMARY mean theta coherence = mean of C(f)
        over 2-12 Hz averaged across retained control windows; peak theta
        coherence = max of C(f) over 2-12 Hz and the frequency at which it occurs;
        significant-theta fraction = fraction of the 2-12 Hz band whose coherence
        exceeds the 95% circular-shift null threshold; peak-coherence percentile =
        percentile of the peak theta coherence within the circular-shift null.
      status: NEW deterministic reduction.
      docx_source_refs: [RQ-025, OUT-011, RQ-059, RQ-060, RQ-061, RQ-062, CON-016]
    - name: depth_statistics
      proposed_signature: "depth_statistics(theta_coh_table)"
      algorithm: >-
        Unit of analysis: per-experiment x per-depth mean theta coherence
        (CON-004; up to 30 values). PRIMARY -- linear mixed-effects model
        (statsmodels): mean theta coherence ~ depth (categorical, 5 levels, fixed)
        + experiment (random intercept). Test the overall depth effect with a
        likelihood-ratio test against the intercept-only random-effects model;
        report chi-square, df, and EXACT p. Effect size: range of the estimated
        marginal depth means plus ICC / conditional-vs-marginal variance
        explained. CONFIRMATORY -- Friedman test (distribution-free repeated-
        measures across the 5 depths, experiments as blocks; report statistic, df,
        exact p, Kendall's W). POST-HOC (only if the omnibus is significant,
        p<0.05): pairwise paired exact two-sided Wilcoxon signed-rank tests
        between depths, Holm-corrected across the family; report matched-pairs
        rank-biserial r for each surviving pair. Excluded sessions (<30 windows)
        contribute no depths, preserving complete Friedman blocks.
      status: NEW; validate that decisions reproduce on re-run and effect sizes fall within tolerance (CON-006).
      docx_source_refs: [RQ-029, CON-004, OUT-014, OUT-015, OUT-016, RQ-068, CON-006]

  analysis_definition:
    description: >-
      Per experiment (6 sessions, control epochs only): (1) load D-dict via
      load_experiment_data; (2) select the five depths via select_five_depths
      from xcoords/ycoords; (3) extract full-duration LFP for those five channels
      via extract_full_lfp (preserving validated preprocessing; regression-anchored
      to the current 10-s loader); (4) build the per-window control mask via
      build_window_control_mask (detect_eth_contact rule: mean-subtracted ETH >
      0.05 = ethanol; any ethanol sample excludes the 4-s window; log ethanol time
      excluded); (5) run compute_sniff_phase (threshold_std=-0.5) and
      build_valid_sniff_mask (1/ISI instantaneous rate; ISI 5th/95th-percentile
      trimming; SNF_PH==-1 noise spans invalid); (6) resample raw SNF to the LFP
      rate via resample_snf_to_lfp; (7) per depth, tile into 4-s / 50%-overlap
      windows, keep all-control all-valid-sniff windows, compute multitaper LFP
      PSD, SNF PSD, and LFP-sniff coherence C(f)=|S12|/sqrt(S1*S2) via
      multitaper_psd_coherence; (8) build the circular-shift null (>=1000 shifts,
      seed 5489) via circular_shift_null and the 95% threshold; (9) reduce each
      coherence spectrum to mean/peak theta coherence, significant-theta fraction,
      peak percentile via reduce_theta_coherence; (10) per experiment pick the
      best depth (highest mean theta coherence), rank depths overall by grand-mean
      theta coherence, count per-ordinal wins; (11) run depth_statistics
      (mixed-effects LRT + Friedman + Holm-corrected Wilcoxon post-hoc if
      significant). Exclude any session with fewer than 30 valid 4-s windows from
      the depth statistics and log it (PROH-002/CON-008).
    docx_source_refs: [OUT-005, RQ-012, RQ-017, RQ-018, RQ-022, RQ-024, RQ-025, RQ-026, RQ-029, PROH-002, CON-008]

  preprocessing:
    - {step: "Load D-dict for each of the 6 sessions (2021-11-01, 2021-11-03, 2021-12-15, 2022-05-17, 2022-06-24, 2022-09-14) via load_experiment_data.", docx_source_refs: [DATA-004, RQ-011]}
    - {step: "Select five channels via select_five_depths: min/max ycoord among valid channels; targets at fractions 0.00/0.25/0.50/0.75/1.00; nearest ycoord with lower-channel-index tie-break (single fixed column); label Depth 1..5 tip->surface. Record channel indices + ycoords (um) per experiment.", docx_source_refs: [RQ-012, RQ-013, RQ-014, RQ-015, RQ-016, OUT-006, OUT-007]}
    - {step: "Extract full-duration LFP for the five selected channels via extract_full_lfp (order-4 Butterworth LP @ 400 Hz -> decimate to 1000 Hz, preserved exactly). Regression anchor: first 10 s must equal the current loader channel-for-channel within numerical tolerance.", docx_source_refs: [OUT-005, RQ-054, OUT-026]}
    - {step: "Define control epochs via detect_eth_contact rule (mean-subtract entire ETH; ETH_ms > 0.05 = ethanol; at/below = control). Fixed rule, no per-experiment adjustment, all 6 sessions. Do NOT threshold raw ETH. Log total ethanol time excluded per experiment.", docx_source_refs: [PROH-003, CON-002, PROH-008]}
    - {step: "Run compute_sniff_phase (threshold_std=-0.5 pinned). Derive instantaneous sniff rate (1/ISI) and the valid-sniff mask via build_valid_sniff_mask: exclude ISI < 5th or > 95th percentile of the experiment's ISI distribution; mark SNF_PH==-1 spans as invalid-sniff noise.", docx_source_refs: [PROH-004, PROH-007, RQ-019, RQ-020, RQ-021, OUT-008]}
    - {step: "Resample raw SNF from LV_Fs (~125 Hz) up to the LFP rate (~1000 Hz) on the shared clock via polyphase/band-limited interpolation for coherence. Use the raw SNF (resampled), not the detected phase (PROH-009).", docx_source_refs: [PROH-005, PROH-009, RQ-044]}
    - {step: "Tile each recording into 4-s windows with 50% overlap; exclude any window that overlaps an ethanol sample OR an invalid-sniff span. Surviving windows are all-control and all-valid-sniff.", docx_source_refs: [CON-002, OUT-008, RQ-040]}

  aggregation:
    - {step: "Per experiment x depth, compute multitaper LFP PSD, SNF PSD (depth-independent), and LFP-sniff coherence C(f)=|S12|/sqrt(S1*S2) via multitaper_psd_coherence (4-s windows, 50% overlap, 7 Slepian tapers NW=4, freqs >= 0.25 Hz), aggregated over retained windows. Retain per-window time-resolved spectrograms/coherence for the Fig 1C heatmaps with sniff-rate overlay.", docx_source_refs: [OUT-009, RQ-023, RQ-040, OUT-010]}
    - {step: "Per experiment x depth, build the circular-shift null (>=1000 shifts, seed 5489) and the per-frequency 95% threshold; report observed coherence as its percentile within the null.", docx_source_refs: [RQ-024, CON-003, RQ-041, RQ-038]}
    - {step: "Per experiment x depth, reduce coherence to mean theta coherence (primary, 2-12 Hz), peak theta coherence + frequency, significant-theta fraction, peak-coherence percentile.", docx_source_refs: [OUT-011, RQ-059, RQ-060, RQ-061, RQ-062, CON-016, OUT-028]}
    - {step: "Best depth: per experiment = depth with highest mean theta coherence; overall = depth with highest grand-mean theta coherence across experiments; report per-ordinal consistency counts (how many experiments each ordinal won).", docx_source_refs: [RQ-026, RQ-027, RQ-028, OUT-012, OUT-029]}
    - {step: "Depth statistics via depth_statistics: mixed-effects LRT (chi-square, df, exact p, marginal-mean range + ICC) + Friedman (stat, df, exact p, Kendall's W) + Holm-corrected Wilcoxon post-hoc with rank-biserial r if the omnibus is significant. If significant, report whether the overall-best depth is significantly greater than the others.", docx_source_refs: [RQ-029, OUT-014, OUT-015, OUT-016, OUT-013, RQ-068]}
    - {step: "Per experiment QC aggregation: recording length (min); n all-control all-valid-sniff 4-s windows used; n windows excluded split by reason (ethanol overlap vs invalid-sniff/noise overlap); n sniffs detected and retained; instantaneous sniff-rate range/median/IQR; pct usable time; the five channel indices + ycoords; discarded-section log (start_s, end_s, reason).", docx_source_refs: [OUT-018, RQ-030, RQ-031, RQ-032, RQ-033, OUT-030, OUT-031, OUT-032]}

  statistical_model:
    - level: within_experiment_repeated_measures_primary
      method: >-
        Linear mixed-effects model (statsmodels): mean theta coherence ~ depth
        (categorical, 5 levels; fixed effect) with experiment as a random
        intercept. Overall depth effect via likelihood-ratio test vs the
        intercept-only random-effects model. Report chi-square, df, exact p.
        Effect size: range of estimated marginal depth means + ICC /
        conditional-vs-marginal variance explained.
      docx_source_refs: [CON-004, OUT-014]
    - level: within_experiment_repeated_measures_confirmatory
      method: >-
        Friedman test across the five depths with experiments as blocks. Report
        statistic, df, exact p, Kendall's W as effect size.
      docx_source_refs: [OUT-015]
    - level: post_hoc
      method: >-
        Only if the omnibus (mixed-effects LRT or Friedman) is significant
        (p<0.05): pairwise paired exact two-sided Wilcoxon signed-rank tests
        between depths, Holm-corrected across the pairwise family; report
        matched-pairs rank-biserial r for each surviving pair.
      docx_source_refs: [OUT-016, OUT-013]

  multiple_comparison:
    description: >-
      Holm correction across the pairwise depth-comparison family in the post-hoc
      step ONLY, and only when the omnibus depth test is significant (p<0.05). No
      other multiplicity correction is contracted. Uncontracted post-hoc
      comparisons are prohibited.
    docx_source_refs: [OUT-016, PROH-006]

  inclusion_exclusion:
    - {rule: "Control epochs only: every analysis window must lie ENTIRELY within control (mean-subtracted ETH <= 0.05). Any window containing >=1 ethanol sample is excluded.", docx_source_refs: [PROH-008, CON-002]}
    - {rule: "Valid-sniff only: exclude any 4-s window overlapping an invalid-sniff span (ISI outside 5th/95th percentile OR SNF_PH==-1 noise).", docx_source_refs: [RQ-020, RQ-021, OUT-008]}
    - {rule: "Sessions with fewer than 30 valid 4-s windows after masking are excluded from the depth statistics and logged in the Methods report; never silently dropped.", docx_source_refs: [PROH-002, CON-008]}
    - {rule: "Depth selection restricted to channels having BOTH a valid LFP row and a ycoord; lower-channel-index tie-break fixes a single column throughout.", docx_source_refs: [RQ-014, RQ-016]}
    - {rule: "Ethanol/control detection uses the detect_eth_contact rule verbatim (mean-subtracted ETH strictly > 0.05); no per-experiment threshold adjustment across the 6 sessions.", docx_source_refs: [PROH-003, PROH-008]}
    - {rule: "Head-fixed vs free-moving contrast from the paper is out of scope; these recordings are a single behavioral condition.", docx_source_refs: [RQ-043]}

  data_provenance:
    description: >-
      Six sessions under C:\Projects\Repos\Neuropixels\DATA, one animal each
      (confirmed by David Gire 2026-07-23, NP-DEMO-4 OPEN-007, same six dates):
      2021-11-01, 2021-11-03, 2021-12-15, 2022-05-17, 2022-06-24, 2022-09-14 (=
      DATA-004's 11/1/2021, 11/3/2021, 12/15/2021, 5/17/2022, 6/24/2022,
      9/14/2022). Each restricted to control (non-ethanol) epochs. All six DATA
      folders confirmed present. Because no two sessions share an animal,
      DATA-003's animal-grouping contingency does not apply; session is the
      random-effect grouping.
    docx_source_refs: [DATA-004, CON-001, CON-009, CON-010, CON-011, CON-012, CON-013, CON-014, DATA-003]

  required_outputs:
    - {result_id: RESULT-coh-spectrum, type: array, desc: "Per experiment x depth: LFP-sniff coherence C(f)=|S12|/sqrt(S1*S2) vs frequency, averaged over retained all-control all-valid-sniff windows.", docx_source_refs: [RQ-064, OUT-010, RQ-023]}
    - {result_id: RESULT-lfp-psd, type: array, desc: "Per experiment x depth: LFP power spectrum vs frequency (multitaper, retained windows).", docx_source_refs: [RQ-065, OUT-010]}
    - {result_id: RESULT-snf-psd, type: array, desc: "Per experiment: SNF power spectrum vs frequency (depth-independent).", docx_source_refs: [RQ-066, OUT-010]}
    - {result_id: RESULT-null-threshold, type: array, desc: "Per experiment x depth: 95% circular-shift null coherence threshold vs frequency (>=1000 shifts, seed 5489).", docx_source_refs: [RQ-067, CON-003, RQ-041]}
    - {result_id: RESULT-theta-coh, type: table, desc: "Per experiment x depth: mean theta coherence (primary, 2-12 Hz), peak theta coherence + frequency, significant-theta fraction, peak-coherence percentile vs null.", docx_source_refs: [OUT-028, OUT-011, RQ-060, RQ-061, RQ-062, CON-016]}
    - {result_id: RESULT-best-depth, type: table, desc: "Per-experiment best depth; overall depth ranking by grand-mean theta coherence; per-ordinal consistency counts.", docx_source_refs: [OUT-029, RQ-027, RQ-028, OUT-012]}
    - {result_id: RESULT-depth-stat, type: object, desc: "Varies-by-depth tests: mixed-effects LRT (chi-square, df, exact p, marginal-mean range + ICC) + Friedman (stat, df, exact p, Kendall's W) + Holm-corrected Wilcoxon post-hoc pairs with rank-biserial r if the omnibus is significant.", docx_source_refs: [RQ-068, OUT-014, OUT-015, OUT-016, OUT-013]}
    - {result_id: RESULT-sniff-rate, type: table, desc: "Per experiment: instantaneous sniff-rate distribution (control epochs) with median and IQR; range.", docx_source_refs: [OUT-030, RQ-031, RQ-007]}
    - {result_id: RESULT-qc-counts, type: table, desc: "Per experiment: length_min, n_windows_used, n_windows_excluded (ethanol / noise), n_sniffs (detected and retained), pct_usable, five chosen channel indices + ycoords (um).", docx_source_refs: [OUT-031, RQ-030, RQ-032]}
    - {result_id: RESULT-qc-discards, type: table, desc: "Per experiment: discarded spans (experiment, start_s, end_s, reason: ethanol / non-sniff noise / ISI outlier).", docx_source_refs: [OUT-032, RQ-033]}
    - {result_id: RESULT-example-traces, type: array, desc: "Representative control segment backing FIG-PAPER1-TRACES: SNF + per-depth band-filtered LFP (theta 2-12, beta 18-30, gamma 65-100 + envelope) + inhalation mask + sniff-onset markers.", docx_source_refs: [RQ-069, OUT-019, RQ-004]}
    - {result_id: RESULT-full-lfp, type: array, desc: "Per experiment: full-duration preprocessed LFP for the five selected channels (regression-anchored to the current 10-s loader). Intermediate object feeding all spectral estimates.", docx_source_refs: [OUT-005, OUT-026]}
    - {result_id: RESULT-methods-doc, type: document, desc: "Deliverable A: Methods / QC report (.docx).", docx_source_refs: [OUT-033, OUT-017, OUT-018]}
    - {result_id: RESULT-results-doc, type: document, desc: "Deliverable B: Results report (.docx).", docx_source_refs: [OUT-034, OUT-022, OUT-023]}

  acceptance_criteria:
    # docx_source_refs intentionally omitted here (schema.AcceptanceCriterion
    # takes only output_id/level/tolerance/comparison_method); traceability for
    # each RESULT-* is carried on its entry in required_outputs above instead.
    - {output_id: RESULT-full-lfp, level: 1, tolerance: "Full-duration LFP restricted to the first 10 s must equal the current 10-s loader output channel-for-channel within float64 numerical tolerance (regression anchor rtol <= 1e-9, atol <= 1e-12).", comparison_method: exact}
    - {output_id: five-depth-selection, level: 1, tolerance: "Five chosen channel indices are exact integers; ycoords (um) match exactly; deterministic given xcoords/ycoords (zero tolerance).", comparison_method: exact}
    - {output_id: RESULT-coh-spectrum, level: 2, tolerance: "Coherence within rtol 1e-6 / atol 1e-9 vs the independent reference on the synthetic fixture slice; distributional agreement on the full workload.", comparison_method: numeric}
    - {output_id: RESULT-lfp-psd, level: 2, tolerance: "LFP PSD within rtol 1e-6 / atol 1e-9 on the fixture slice.", comparison_method: numeric}
    - {output_id: RESULT-snf-psd, level: 2, tolerance: "SNF PSD within rtol 1e-6 / atol 1e-9 on the fixture slice.", comparison_method: numeric}
    - {output_id: RESULT-null-threshold, level: 1, tolerance: "Bit-for-bit reproducible given seed 5489 on re-run (zero tolerance). Cross-implementation acceptance is at the significance-decision level (see RESULT-theta-coh / RESULT-depth-stat).", comparison_method: exact}
    - {output_id: RESULT-theta-coh, level: 2, tolerance: "Mean/peak theta coherence and peak frequency within rtol 1e-6 on the fixture slice; significant-theta fraction and peak-coherence percentile inherit the circular-shift significance DECISION (exceeds/does-not-exceed 95% null) as the workload-level accepted comparison.", comparison_method: numeric}
    - {output_id: RESULT-best-depth, level: 1, tolerance: "Best-depth ordinal per experiment, overall ranking, and per-ordinal consistency counts are exact integers; deterministic given RESULT-theta-coh.", comparison_method: exact}
    - {output_id: RESULT-depth-stat, level: 3, tolerance: "Same significance decision (alpha=0.05) on re-run for the mixed-effects LRT and Friedman; chi-square/Friedman statistic and exact p within rtol 1e-4; Kendall's W, marginal-mean range, ICC, and post-hoc rank-biserial r within 1e-4; Holm-surviving pairs identical.", comparison_method: statistical_decision}
    - {output_id: RESULT-sniff-rate, level: 2, tolerance: "Median and IQR of instantaneous sniff rate within 1e-4 Hz on the fixture slice (deterministic from validated compute_sniff_phase onsets).", comparison_method: numeric}
    - {output_id: RESULT-qc-counts, level: 1, tolerance: "length_min, n_windows_used, n_windows_excluded (ethanol/noise), n_sniffs, channel indices exact integers; ycoords and pct_usable within 1e-4.", comparison_method: exact}
    - {output_id: RESULT-qc-discards, level: 1, tolerance: "Discarded-span reasons and boundaries exact; start_s/end_s within one LFP sample (1 ms) of the deterministic mask edges.", comparison_method: exact}
    - {output_id: RESULT-example-traces, level: 2, tolerance: "Band-filtered LFP and inhalation mask within rtol 1e-6 on the fixture slice (deterministic filters); representative segment chosen by the display convention in the figure contract.", comparison_method: numeric}
    - {output_id: RESULT-methods-doc, level: 4, tolerance: "Scientific-level review: all injected numbers must match their source RESULT objects exactly (no hand-typed values); required sections/figures/tables present; exclusions and discarded-section log complete; QC framing correct.", comparison_method: scientific}
    - {output_id: RESULT-results-doc, level: 4, tolerance: "Scientific-level review: injected numbers match sources exactly; exact p-values and effect sizes reported; exploratory (non-causal) framing for depth-dependence, confirmatory framing for the coherence replication; required figures/tables present.", comparison_method: scientific}

  prohibited_changes:
    - {change: "Editing the Optimized Python kernel analysis logic, the Golden Fixtures, or any tolerance configuration (beyond the additive, validated full-duration LFP extraction).", docx_source_refs: [PROH-010]}
    - {change: "Adjusting the sniff-onset threshold_std away from -0.5 without separate human sign-off.", docx_source_refs: [PROH-007, PROH-004]}
    - {change: "Adjusting the ethanol threshold per experiment, or thresholding the RAW (non-mean-subtracted) ETH signal. The 0.05 mean-subtracted rule is fixed for all six sessions.", docx_source_refs: [PROH-003, PROH-008]}
    - {change: "Substituting the detected sniff phase (SNF_PH) for the raw SNF signal in the coherence computation. Coherence uses raw SNF (resampled) vs LFP.", docx_source_refs: [PROH-009]}
    - {change: "Tuning any pinned spectral parameter: 4-s windows, 50% overlap, 7 Slepian tapers (NW=4), 0.25 Hz lower bound, theta 2-12 Hz.", docx_source_refs: [RQ-040, RQ-039]}
    - {change: "Changing the circular-shift null: <1000 shifts, a threshold other than the 95th percentile, or a seed other than 5489.", docx_source_refs: [RQ-041, CON-003]}
    - {change: "Applying the SNF-not-LFP prohibition from the phase-locking family: this task intentionally analyzes the LFP as the neural signal and SNF as the respiratory reference.", docx_source_refs: [PROH-001]}
    - {change: "Running uncontracted post-hoc comparisons or using causal/over-definitive language for the exploratory depth-dependence question.", docx_source_refs: [PROH-006, OUT-016]}

  failure_conditions:
    - {condition: "A session yields fewer than 30 valid 4-s windows after masking; it is excluded from the depth statistics and logged (never silently dropped).", docx_source_refs: [PROH-002, CON-008]}
    - {condition: "Fewer than 3 sessions survive the >=30-window criterion, leaving the repeated-measures depth statistics underpowered; execution blocked and reported.", docx_source_refs: [PROH-002, CON-004]}
    - {condition: "Full-duration LFP fails the first-10-s regression anchor against the current loader; extraction blocked and reported.", docx_source_refs: [OUT-026]}
    - {condition: "Multitaper PSD/coherence fails the synthetic-fixture tolerance (rtol 1e-6 / atol 1e-9); analysis blocked.", docx_source_refs: [DATA-002]}
    - {condition: "Circular-shift null is not bit-for-bit reproducible given seed 5489; significance blocked.", docx_source_refs: [RQ-038]}

figures:
  # --- Deliverable A: Methods / QC figures (Fig 1A / 1C / 1D analogues) ---
  - figure_id: FIG-PAPER1-TRACES
    title: "Figure 1A analogue: example band-filtered LFP + sniff traces (per depth)"
    docx_source_refs: [OUT-019, RQ-004, RQ-069]
    scientific_purpose: >-
      For a representative experiment and a representative control segment, show
      the SNF signal on top and, for each of the five depths, the LFP shown
      unfiltered and band-filtered into theta (2-12 Hz), beta (18-30 Hz), and
      gamma (65-100 Hz plus its amplitude envelope). Traces colored green during
      inhalation and black during exhalation/pause; sniff-onset markers shown.
      DISPLAY CONVENTION (reproducibility, non-scientific): the representative
      experiment is the session with the greatest number of retained all-control
      all-valid-sniff windows (tie-break: earliest recording date); the
      representative segment is the first qualifying contiguous control span of
      fixed display length. This choice affects presentation only, not any
      reported result.
    required: true
    source_results: [RESULT-example-traces, RESULT-qc-counts]
    axis_requirements:
      x_label: "time (s)"
      y_label: "SNF (a.u.) [top]; LFP amplitude per band, per depth (uV) [stacked rows]"
      zero_reference: true
      log_scale: false
      truncation_permitted: false
    visual_encoding:
      condition_mapping: {inhalation: green, exhalation_or_pause: black, sniff_onsets: markers, bands: [unfiltered, theta_2_12, beta_18_30, gamma_65_100_plus_envelope]}
      raw_data_also_available: true
    statistical_annotations:
      permitted_tests: []
      exact_p_values: false
      significance_stars: false
    quality: {vector: true, raster_dpi: 300, colorblind_review: true, min_font: 7, truncation_permitted: false}
    caption_requirements:
      - "state the representative experiment (date) and segment window, and that both were chosen by a fixed display convention (most retained windows; earliest-date tie-break)"
      - "list the five depth channel indices + ycoords (um) shown, injected from RESULT-qc-counts (never typed by hand)"
      - "state band definitions: theta 2-12 Hz, beta 18-30 Hz, gamma 65-100 Hz + envelope; inhalation = green, exhalation/pause = black"

