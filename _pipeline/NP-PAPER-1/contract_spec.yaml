report:
  methods_report:
    output_filename: NP-PAPER-1_methods.docx
    docx_source_refs: [OUT-017, OUT-018, OUT-033]
    intended_audience: "lab (Deliverable A: Methods / QC document)"
    scientific_status: qc_methods
    separate_from_results_report: true
    required_sections: [Methods, Depth Selection, Control-Epoch and Valid-Sniff Masking, Spectral Estimation, Per-Experiment QC Summary Table, Discarded-Sections Log]
    required_figures: [FIG-PAPER1-TRACES, FIG-PAPER1-SPECTRO, FIG-PAPER1-SNIFFRATE]
    required_tables: [RESULT-qc-counts, RESULT-qc-discards, RESULT-sniff-rate]
    reporting_rules:
      exact_N: true
      report_exclusions: true
      report_effect_sizes: false
      report_exact_p: false
      prohibit_causal_language: true
      prohibit_uncontracted_post_hoc: true
      separate_qc_document_required: true
    notes: >-
      Deliverable A documents exactly how the analysis was run and what was
      included/discarded. Per experiment it reports: recording length (min);
      n all-control all-valid-sniff 4-s windows used; n windows excluded split by
      reason (ethanol overlap vs invalid-sniff/noise overlap); n sniffs detected
      and retained (after 5th/95th-percentile ISI exclusion); instantaneous
      sniff-rate range and median; pct usable time; and the five chosen channel
      indices + ycoords (um). The discarded-sections log lists, for every excluded
      span, the experiment, start_s, end_s, and reason (ethanol / non-sniff noise
      / ISI outlier). Sessions excluded from depth statistics (<30 windows) are
      logged here. All values injected from RESULT-qc-counts / RESULT-qc-discards
      / RESULT-sniff-rate; no number typed by hand. Scientific-status framing:
      the coherence computation is a confirmatory replication of the paper's
      published method (PROH-006).

  results_report:
    output_filename: NP-PAPER-1_results.docx
    docx_source_refs: [OUT-022, OUT-023, OUT-034]
    intended_audience: "lab (Deliverable B: Results document)"
    scientific_status: confirmatory_coherence_plus_exploratory_depth
    separate_from_results_report: false
    required_sections: [Results, Per-Depth Theta Coherence, Best Depth, Does Alignment Vary by Depth, Figures]
    required_figures: [FIG-PAPER1-PSD, FIG-PAPER1-COH, FIG-PAPER1-DEPTH-SUMMARY]
    required_tables: [RESULT-theta-coh, RESULT-best-depth, RESULT-depth-stat]
    reporting_rules:
      exact_N: true
      report_exclusions: true
      report_effect_sizes: true
      report_exact_p: true
      prohibit_causal_language: true   # depth-dependence is exploratory (PROH-006)
      prohibit_uncontracted_post_hoc: true
      separate_qc_document_required: true
    notes: >-
      Deliverable B answers the two questions. It reports: per-depth
      theta-coherence strength (mean +/- SEM across experiments); the best depth
      per experiment and overall, with per-ordinal consistency counts; and the
      varies-by-depth tests (mixed-effects LRT and Friedman, exact p and effect
      sizes; Holm-corrected Wilcoxon post-hoc pairs with rank-biserial r only if
      the omnibus is significant). Scientific-status framing (PROH-006/RQ-050):
      the depth-dependence question is EXPLORATORY -- frame as characterization,
      report exact p-values and effect sizes, and avoid causal / over-definitive
      language; the coherence computation itself is a CONFIRMATORY replication of
      the paper's published method. All values injected from RESULT-theta-coh /
      RESULT-best-depth / RESULT-depth-stat; no number typed by hand.
  appendices:
    - "Methods/QC report (NP-PAPER-1_methods.docx, Deliverable A) and Results report (NP-PAPER-1_results.docx, Deliverable B) are SEPARATE documents, per OUT-017 / OUT-022."

# The request is unusually prescriptive: algorithm parameters, thresholds, seeds,
# tolerances, tests, exclusions, and reporting stance are all pinned by the
# requester and transcribed above. No genuinely unresolved SCIENTIFIC choice
# remains that would require human sign-off before approval. Near-ambiguities
# that were considered and RESOLVED WITHIN the contract (not left open) are:
#  (1) Random-effect grouping (session vs animal, DATA-003): resolved -- each of
#      the six sessions is a distinct animal (David Gire, 2026-07-23, NP-DEMO-4
#      OPEN-007, same six dates); session == animal, no nesting.
#  (2) "single fixed column" in depth selection (RQ-016): resolved -- the stated
#      lower-channel-index tie-break already fixes a single column deterministically.
#  (3) Circular-shift offset sampling mechanics: resolved -- follows the paper's
