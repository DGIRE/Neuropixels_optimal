    docx_source_refs:
    - OUT-032
    - RQ-033
    result_id: RESULT-qc-discards
    type: table
  - desc: 'Representative control segment backing FIG-PAPER1-TRACES: SNF + per-depth
      band-filtered LFP (theta 2-12, beta 18-30, gamma 65-100 + envelope) + inhalation
      mask + sniff-onset markers.'
    docx_source_refs:
    - RQ-069
    - OUT-019
    - RQ-004
    result_id: RESULT-example-traces
    type: array
  - desc: 'Per experiment: full-duration preprocessed LFP for the five selected channels
      (regression-anchored to the current 10-s loader). Intermediate object feeding
      all spectral estimates.'
    docx_source_refs:
    - OUT-005
    - OUT-026
    result_id: RESULT-full-lfp
    type: array
  - desc: 'Deliverable A: Methods / QC report (.docx).'
    docx_source_refs:
    - OUT-033
    - OUT-017
    - OUT-018
    result_id: RESULT-methods-doc
    type: document
  - desc: 'Deliverable B: Results report (.docx).'
    docx_source_refs:
    - OUT-034
    - OUT-022
    - OUT-023
    result_id: RESULT-results-doc
    type: document
  required_validated_functions:
  - docx_source_refs:
    - RQ-011
    - OUT-005
    - RQ-054
    - PROH-010
    module: Optimized Python/load_experiment_data.py
    name: load_experiment_data
    usage: Standard D-dict loader providing LFP/LFP_t/LFP_Fs/NP_Fs/SNF/ETH/LV_Fs/xcoords/ycoords.
      Reused as-is; NOT edited. The additive full-duration LFP extraction (extract_full_lfp)
      preserves this loader's validated preprocessing (order-4 Butterworth LP @ 400
      Hz -> decimate to 1000 Hz, constants LFP_LP_HZ=400.0, LFP_OUT_FS=1000.0) exactly.
  - docx_source_refs:
    - PROH-004
    - PROH-007
    - RQ-019
    - RQ-021
    module: Optimized Python/analyses/compute_sniff_phase.py
    name: compute_sniff_phase
    usage: Reused VERBATIM at the pinned default threshold_std=-0.5 (PROH-007; never
      adjusted without separate human sign-off). Provides sniff_onsets_s (inhalation
      onset times, s), sniff_dur_s, and SNF_PH (per-sample phase 0..1; -1 marks noise
      / outside-cycle spans). sniff_onsets_s -> inter-sniff intervals -> instantaneous
      sniff rate; SNF_PH==-1 spans -> invalid-sniff (noise) sections.
  - docx_source_refs:
    - PROH-003
    - PROH-008
    - CON-002
    module: _pipeline/NP-DEMO-3/03_software/detect_eth_contact.py
    name: detect_eth_contact
    usage: 'Reuse the NP-DEMO-3 validated ethanol-detection RULE verbatim (eth_threshold=0.05,
      mean-subtract ENTIRE ETH trace, mark ETH_ms > 0.05 = ethanol; at/below = control;
      no per-experiment adjustment). Provides eth_contact_mask at LV_Fs. NOTE: this
      task needs a WINDOW-LEVEL control mask on the LFP clock, not the contact-run
      count, so a thin new deterministic wrapper (build_window_control_mask) consumes
      eth_contact_mask -- the thresholding rule itself is reused unchanged (PROH-003/PROH-008).'
  risk: red
  scientific_question:
    description: Across the olfactory-bulb Neuropixels probe, (Q1) which recording
      depth best aligns the LFP to sniffing -- i.e. which of five evenly-spaced depths
      has the strongest theta-band (2-12 Hz) LFP-sniff spectral coherence, the paper's
      measure of alignment -- and (Q2) does the strength of that alignment vary systematically
      with depth across experiments? A per-depth replication of Rafilson et al. (2024),
      Figure 1, computed on control (non-ethanol) epochs only.
    docx_source_refs:
    - OUT-001
    - OUT-002
    - RQ-002
    - OUT-003
    - RQ-025
    - RQ-026
    - RQ-029
  statistical_model:
  - docx_source_refs:
    - CON-004
    - OUT-014
    level: within_experiment_repeated_measures_primary
    method: 'Linear mixed-effects model (statsmodels): mean theta coherence ~ depth
      (categorical, 5 levels; fixed effect) with experiment as a random intercept.
      Overall depth effect via likelihood-ratio test vs the intercept-only random-effects
      model. Report chi-square, df, exact p. Effect size: range of estimated marginal
      depth means + ICC / conditional-vs-marginal variance explained.'
  - docx_source_refs:
    - OUT-015
    level: within_experiment_repeated_measures_confirmatory
    method: Friedman test across the five depths with experiments as blocks. Report
      statistic, df, exact p, Kendall's W as effect size.
  - docx_source_refs:
    - OUT-016
    - OUT-013
    level: post_hoc
    method: 'Only if the omnibus (mixed-effects LRT or Friedman) is significant (p<0.05):
      pairwise paired exact two-sided Wilcoxon signed-rank tests between depths, Holm-corrected
      across the pairwise family; report matched-pairs rank-biserial r for each surviving
      pair.'
