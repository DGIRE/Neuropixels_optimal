# NP-PAPER-1 04_results serialization manifest.
#
# Produced by the composing runner (03_software/np_paper1_analysis.py +
# run_analysis_np_paper1.py), Blueprint v2 P3 / D7. This file documents WHERE
# each contract RESULT-* object lives on disk and in what format, per the
# task instruction to "document your choice in a short results_manifest.yaml".
#
# Layout:
#   04_results/
#     sessions/<session_dirname>/         -- per-session checkpoints (resumable)
#       DONE.json                          -- completion marker (resume gate)
#       summary.json / summary.yaml        -- QC + theta-coherence summary (small)
#       lfp_full.npy                       -- (5, n_full) float64 full-duration LFP
#                                              for the 5 selected depths -- RESULT-full-lfp
#       snf_lfp.npy                        -- (n_full,) float64 raw SNF resampled to LFP clock
#       control_valid_windows.npy          -- (n_windows_used,) int64 retained window
#                                              START sample indices on the LFP clock
#       spectral_depth{1..5}.npz           -- per depth: freqs, coherence, lfp_psd,
#                                              snf_psd, null_threshold
#                                              (RESULT-coh-spectrum / RESULT-lfp-psd /
#                                              RESULT-snf-psd / RESULT-null-threshold)
#       qc_discards.yaml                   -- per-session RESULT-qc-discards detail
#                                              (start_s/end_s/reason spans)
#
#     RESULT-qc-counts.yaml                -- cross-session QC table (per experiment:
#                                              length_min, n_windows_used/excluded,
#                                              pct_usable_time, n_sniffs, 5 channel
#                                              indices + ycoords)
#     RESULT-sniff-rate.yaml               -- cross-session sniff-rate table (median/
#                                              IQR/range, control epochs only)
#     RESULT-qc-discards.yaml              -- index into each session's qc_discards.yaml
#     RESULT-theta-coh.yaml                -- long-form per experiment x depth table
#                                              (mean/peak theta coh, peak freq,
#                                              sig-theta fraction, peak percentile)
#     RESULT-best-depth.yaml               -- per-experiment best depth, overall
#                                              ranking by grand-mean theta coherence,
#                                              per-ordinal consistency counts
#     RESULT-depth-stat.yaml               -- mixed-effects LRT + Friedman +
#                                              Holm-Wilcoxon post-hoc (depth_statistics
#                                              output), OR RESULT-depth-stat_BLOCKED.yaml
#                                              if <3 sessions pass the >=30-window gate
#     RESULT-grand-mean-spectra.npz        -- grand mean +/- SEM per depth across
#                                              experiments for coherence, LFP PSD,
#                                              null threshold, plus depth-independent
#                                              SNF PSD grand mean (FIG-PAPER1-PSD/COH
#                                              underlying data)
#     RESULT-example-traces.npz            -- representative-segment band-filtered
#                                              LFP (unfiltered/theta/beta/gamma+envelope)
#                                              per depth + SNF segment + inhalation mask
#                                              + sniff-onset markers (FIG-PAPER1-TRACES)
#     RESULT-example-traces_meta.yaml      -- which session/segment was chosen + the
#                                              display-convention note
#     RESULT-example-spectrogram.npz       -- per-window time-resolved LFP-power,
#                                              SNF-power, and coherence spectrograms
#                                              (freq x window-time) for the SAME
#                                              representative session as
#                                              RESULT-example-traces (06-24-2022),
#                                              plus window_center_s and the
#                                              instantaneous sniff rate at each
#                                              window center (OUT-009/010,
#                                              FIG-PAPER1-SPECTRO). Added 2026-07-25
#                                              (gap-fill, not a deviation -- see
#                                              History below).
#     RESULT-example-spectrogram_meta.yaml -- which session was used + provenance/
#                                              verification note
#     RESULT-sniff-rate-raw.npz            -- raw per-sniff instantaneous-rate
#                                              arrays (1/ISI, Hz), control epochs
#                                              only, one per session (key
#                                              "<session>__inst_rate_hz") + a
#                                              companion per-sniff ISI-trim-validity
#                                              boolean array (key
#                                              "<session>__isi_trim_valid"), for
#                                              FIG-PAPER1-SNIFFRATE's histogram/KDE
#                                              visual_encoding. Added 2026-07-25
#                                              (gap-fill, not a deviation -- see
#                                              History below).
#     RESULT-sniff-rate-raw_meta.yaml      -- per-session schema/counts + provenance/
#                                              verification note
#
# RESULT-methods-doc / RESULT-results-doc (the two .docx deliverables) are NOT
# produced by this runner -- they are a separate report-writing step downstream
# of these RESULT-* data objects (out of scope for "IMPLEMENTED": D7 produces
# the RESULT-* data, not the certified prose documents).
#
# Format choice rationale: small per-experiment tables/scalars -> YAML (human-
# readable, diffable, matches this repo's established convention in
# NP-DEMO-1..4's 04_results). Large numeric arrays (full-duration LFP, per-
# frequency spectra, band-filtered trace segments) -> .npy/.npz (avoids YAML's
# poor fidelity/size for big float64 arrays, matches this repo's existing
# checkpoint-array convention from load_experiment_data.py/extract_full_lfp.py).
#
