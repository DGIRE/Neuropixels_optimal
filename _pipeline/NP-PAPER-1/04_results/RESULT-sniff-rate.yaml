  coherence analysis windows (build_valid_sniff_mask). median_hz/q1_hz/q3_hz/iqr_hz
  are unaffected by this note -- they characterize the same untrimmed control-epoch
  distribution the contract''s RESULT-sniff-rate ''range'' field was always defined
  over; this note exists so the Methods report does not imply those extremes entered
  the coherence estimate.'
