note: FIG-PAPER1-SNIFFRATE histogram/KDE gap-fill (2026-07-25, not a deviation). One
  1-D float64 array per session at key '<session>__inst_rate_hz' (raw per-sniff instantaneous
  rate, 1/ISI, Hz), restricted to control epochs ONLY -- the SAME restriction already
  used for RESULT-sniff-rate.yaml's frozen 5-number summary (median/Q1/Q3/IQR/min/max),
  verified bit-for-bit (median/Q1/Q3/min/max recomputed from this raw array match
  the frozen file exactly). NOT further restricted by the ISI-percentile trim that
  gates coherence windows -- doing so would make this array inconsistent with the
  frozen summary it backs. A companion boolean array at '<session>__isi_trim_valid'
  (same length, same order) marks which of these raw sniffs additionally pass the
  ISI-percentile trim, for optional overlay/filtering without altering what the primary
  frozen summary describes.
