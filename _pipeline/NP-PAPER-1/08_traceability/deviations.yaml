  resolution_date: '2026-07-24'
  resolution_summary: >-
    Approved Resolution Option B: a documented duration-matching .bin-file
    override implemented entirely in this task's own additive code
    (03_software/resolve_session_binfile.py::resolve_full_lfp_binfile),
    never touching or_validate_files.py (kernel, PROH-010). Algorithm:
    enumerate all *.ap.bin candidates under the session folder; exclude any
