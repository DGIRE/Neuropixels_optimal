hazards:
  - id: HAZ-001
    description: >-
      MATLAB half-away-from-zero rounding. round(62.5) → MATLAB=63, Python=62.
      Corrupts MAX_DUR/MIN_ISI and hence all SNF_PH ramps (~2141 samples affected).
    mitigation: "Use analyses._common.matlab_round() — already baked into kernel functions"

  - id: HAZ-002
    description: >-
      SNF/spike clock misalignment: spike time → LV index via matlab_round(t * LV_Fs),
      clamped to array bounds. Drift between LabView and SpikeGLX clocks corrupts phase.
    mitigation: >-
      load_experiment_data uses ks_driftmap when available. Validate spike_SNF_PH
      against fixture (rtol 1e-12). Clock misalignment is a contract FAILURE CONDITION.

  - id: HAZ-003
    description: "PROHIBITED: using D['LFP'] instead of D['SNF'] for phase. LFP is a neural signal, SNF is behavioral."
    mitigation: "compute_sniff_phase / compute_spike_phase operate on D['SNF'] only. Fixture enforces this."

  - id: HAZ-004
    description: "Float64 vs float32 divergence in E1 (vectorized unit aggregation); unitDepths/unitAmps tolerance rtol=1e-5."
    mitigation: "Use optconfig default (optimized). optconfig.set_baseline() reverts if needed."

  - id: HAZ-005
    description: "NaN unitMeanSniffPhase when unit has <5 valid spikes — correct per contract exclusion rules."
    mitigation: "Filter with ~np.isnan(); log every excluded unit per condition in QC document."

  - id: HAZ-006
    description: >-
      New analysis requires MRL and preferred phase per unit per condition (ethanol vs control).
      The kernel assigns phase to spikes but does NOT compute MRL — that is new code that
      must sit in the extension point, NOT the kernel.
    mitigation: >-
      Implement circular statistics (MRL = |mean(exp(i*phase_rad))|, preferred = angle(mean(...)))
      in a new file at the extension point. Use scipy.stats.circmean/circvar or manual
      circular mean. Validate against synthetic oracle before running full data.
