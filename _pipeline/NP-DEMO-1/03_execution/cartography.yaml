    notes: >-
      Requires D keys: SNF_PH, sniff_onsets, spikeTimes, sp.clu, unitIDs, LV_Fs, SNF.
      Valid phase = SNF_PH >= 0 (sentinel -1 = outside sniff cycle). Time-index mapping
      via matlab_round(spike_time_s * LV_Fs), clamped to [0, nLV-1].
      Optimized path (bincount) == baseline to 1e-12 tolerance.

