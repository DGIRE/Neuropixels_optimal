# Contract spec for NP-DEMO-1 — authored from Demo_request.docx:
#  * phase-lock spikes to the SNF (sniff sensor) signal, NOT the LFP
#  * exclude noisy / non-sniffing SNF segments
#  * main analysis document + a SEPARATE QC/data document (per-experiment sniff
#    examples, counts, and a discarded-data log)
# data_provenance is intentionally NOT pinned here so it is seeded from the
# request's DATA-001 item (X: root + six session dates).
task_id: NP-DEMO-1
contract_version: 1
analysis:
  scientific_question: >-
    Does ethanol exposure alter the phase-locking of olfactory-bulb single-unit
    spikes to the sniff (SNF sensor) signal phase, relative to control trials?
  status: confirmatory
  risk: red                     # new preprocessing (sniff segmentation) + cross-tool inference + report-critical
  experimental_structure: >-
    Independent unit = animal (n animals); trials nested within animal; units
    nested within animal. Statistics at the animal level (no pseudoreplication).
  inputs:
    - {object: D-dict, from: load_experiment_data, fields: [SNF, sp.st, sp.clu, ETH, LV_Fs, sniff_onsets]}
    - {object: SNF, description: raw sniff-sensor (thermistor/pressure) signal, rate_Hz_source: LV_Fs (~125 Hz)}
    - {object: spike_times, source: Kilosort dir, units: seconds}
  required_validated_functions:
    - compute_sniff_phase        # SNF-signal phase + sniff detection (reuse kernel, D7)
    - compute_spike_phase        # assign each spike its SNF phase
    - load_experiment_data
  analysis_definition: >-
    From the SNF sniff-sensor signal (NOT the LFP), detect valid sniff segments and
    compute instantaneous sniff phase via the validated compute_sniff_phase; assign
    each spike the SNF phase at its spike time, restricted to valid sniff periods;
    per unit compute phase-locking (mean resultant length, MRL) and preferred phase;
    compare ethanol vs control at the animal level.
  preprocessing:
    - detect sniff segments from SNF via compute_sniff_phase (GUI-default thresholds, pinned)
    - reject SNF segments flagged as noise / non-sniffing; keep only valid detected sniffs
    - sniff phase from the analytic signal of the (valid) SNF; circular statistics for phase
  aggregation:
    - per-unit MRL and preferred phase over valid-sniff spikes, then per-animal mean, ethanol vs control
  statistical_model: >-
    Paired comparison across animals (ethanol vs control) of animal-mean MRL;
    circular test for preferred-phase shift; effect sizes and exact p reported.
  multiple_comparison: Benjamini-Hochberg FDR across units for per-unit reporting only
  randomization_seed: "5489"
  inclusion_exclusion: >-
    Include only spikes falling in valid detected sniff segments; exclude SNF
    sections flagged non-sniffing / noise. Exclude units with < 0.1 Hz firing or
    < 50 valid-sniff spikes in a condition. Every discarded SNF section is logged
    (experiment, time range, reason) for the QC document.
  assumptions:
    - sniff detection + phase use compute_sniff_phase GUI-default thresholds (pinned)
    - SNF sampled at LV_Fs (~125 Hz); spikes and SNF share the LabView/SpikeGLX clock via the loader
  required_outputs:
    - {result_id: RESULT-mrl, type: table, desc: per-unit + per-animal MRL by condition (valid sniffs only)}
    - {result_id: RESULT-phase, type: table, desc: preferred SNF phase by condition}
    - {result_id: RESULT-stat, type: object, desc: paired animal-level test + effect size + exact p}
    - {result_id: RESULT-qc-counts, type: table, desc: per-experiment n_sniffs / n_neurons / n_trials used}
    - {result_id: RESULT-qc-discards, type: table, desc: per-experiment discarded SNF sections + reason}
    - {result_id: RESULT-qc-doc, type: document, desc: SEPARATE QC/data document bundling the sniff-example figures + counts + discard log}
  acceptance_criteria:
    - {output_id: RESULT-mrl, level: 3, tolerance: "distributional; MRL within 1e-6 on fixture slice", comparison_method: distributional}
    - {output_id: RESULT-phase, level: 3, tolerance: "circular distance < 1e-6 on fixture slice", comparison_method: circular_phase}
    - {output_id: RESULT-stat, level: 3, tolerance: "same significance decision on full workload", comparison_method: statistical_decision}
    - {output_id: RESULT-qc-counts, level: 1, tolerance: "exact integer counts", comparison_method: exact}
  prohibited_changes:
    - using the LFP (instead of the SNF signal) for phase — SNF is required
    - including SNF sections flagged noise / non-sniffing
    - editing Optimized Python kernel files, Golden Fixtures, or tolerance config
    - changing sniff-detection thresholds without human sign-off
  failure_conditions:
    - SNF / spike clock misalignment detected
    - fixture slice disagreement beyond tolerance
    - no valid sniff segments detected in an experiment
figures:
  - figure_id: FIG-DEMO1-01
    title: Ethanol vs control phase-locking of OB units to the sniff (SNF) signal
    scientific_purpose: >-
      Show the population shift in spike-SNF phase locking with ethanol, with the
      raw per-unit distribution visible (not just summary bars).
    required: true
    source_results: [RESULT-mrl, RESULT-phase, RESULT-stat]
    axis_requirements:
      x_label: "SNF sniff phase (rad)"
      y_label: "spike rate (norm.) / MRL"
      zero_reference: true
      log_scale: false
      truncation_permitted: false
    visual_encoding:
      condition_mapping: {ethanol: solid, control: dashed}
      raw_data_also_available: true
    statistical_annotations:
      permitted_tests: [paired_animal_level]
      exact_p_values: true
      significance_stars: false
    quality: {vector: true, raster_dpi: 300, colorblind_review: true, min_font: 7}
    caption_requirements:
      - state n_animals and n_units per condition (computed, not typed)
      - state exact p and effect size from RESULT-stat
    sketch_guidance:
      source: figure_examples/Demo figure.bmp
      intent: >-
        Follow the layout of the included sketch (overlaid ethanol/control population
        curves across sniff phase, per-unit points behind). Layout/overlay/annotation
        only — values, N, error bars, axis units and no-truncation come from the
        contract + results, never the sketch.
  - figure_id: FIG-DEMO1-QC
    title: Example sniffing per experiment (interim QC)
    scientific_purpose: >-
      For each experiment, show a representative SNF trace with detected sniff
      segments highlighted and discarded (noise / non-sniffing) sections marked, so
      the reader can see what counted as a valid sniff.
    required: true
    source_results: [RESULT-qc-counts, RESULT-qc-discards]
    axis_requirements:
      x_label: "time (s)"
      y_label: "SNF signal (a.u.)"
      zero_reference: false
      log_scale: false
      truncation_permitted: false
    visual_encoding:
      condition_mapping: {valid_sniff: solid, discarded: shaded}
      raw_data_also_available: true
    statistical_annotations:
      permitted_tests: []
      exact_p_values: false
      significance_stars: false
    quality: {vector: true, raster_dpi: 300, colorblind_review: true, min_font: 7}
    caption_requirements:
      - one panel per experiment, labeled by session date
      - state n_sniffs / n_neurons / n_trials for that experiment (computed)
report:
  output_filename: NP-DEMO-1_ethanol_sniff_phase_locking.docx
  intended_audience: lab + demo
  scientific_status: confirmatory
  required_sections: [Question, Methods, Results, Figure, Limitations]
  required_figures: [FIG-DEMO1-01]
  required_tables: [RESULT-mrl, RESULT-phase]
  reporting_rules:
    exact_N: true
    report_exclusions: true
    report_effect_sizes: true
    report_exact_p: true
    prohibit_causal_language: false
    prohibit_uncontracted_post_hoc: true
    separate_qc_document_required: true
  appendices:
    - "SEPARATE QC/data document (RESULT-qc-doc): per-experiment sniff-example figures (FIG-DEMO1-QC), n_sniffs / n_neurons / n_trials, and a discarded-section log (experiment, time range, reason)."
open_decisions: []                      # none open -> eligible for approval (gate A)
