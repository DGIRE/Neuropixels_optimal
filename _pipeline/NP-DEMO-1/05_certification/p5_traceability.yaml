# ============================================================
# ANALYSIS REQUIREMENTS → RESULT OBJECTS
# ============================================================
analysis_traceability:

  SNF_not_LFP:
    contracted: "Phase from SNF (sniff sensor), never LFP"
    evidence:
      - np_demo1_analysis.py uses compute_sniff_phase(D) operating on D['SNF'] only
      - HAZ-003 in cartography.yaml explicitly prohibits LFP use
      - Fixture spike_SNF_PH validated bit-exact against golden fixture
    result: PASS

  sniff_segmentation:
    contracted: "Detect valid sniff segments; reject noise/non-sniffing"
    evidence:
      - compute_sniff_phase run with GUI-default threshold_std=-0.5 (pinned)
      - valid_sniff_mask built from SNF_PH >= 0 (sentinel -1 = outside cycle)
      - RESULT_qc_discards.json: per-session discard log with reasons
      - FIG-DEMO1-QC shows gray (non-sniffing) and orange-red (noise) shading
    result: PASS

  inclusion_criteria:
    contracted: "Exclude units < 0.1 Hz or < 50 valid-sniff spikes per condition"
    evidence:
      - np_demo1_analysis.py:compute_unit_mrl applies both criteria
      - Numeric gate (P3 step 4): 69/379 units excluded by rate < 0.1 Hz, matches golden unitFiringRate
    result: PASS

  per_unit_mrl_and_phase:
    contracted: "Per-unit MRL and preferred phase by condition"
    evidence:
      - RESULT_mrl.json: 2247 rows (unit×condition level entries), includes mrl, n_valid_sniff_spikes, included flag
      - RESULT_phase.json: matching per-unit preferred_phase_rad by condition
      - Three-way rederivation: worst diff 2.7e-15 (tol 1e-12)
    result: PASS

  per_animal_mean_mrl:
    contracted: "Animal-level mean MRL by condition (anti-pseudoreplication)"
    evidence:
      - RESULT_mrl.json includes level='animal' rows with animal-mean MRL per condition
      - figdata/FIG_DEMO1_01_animals.json confirms 5 paired animals (2021-11-03 excluded)
      - All 5 animals: control MRL > ethanol MRL (r=-1.0)
    result: PASS

  paired_wilcoxon:
    contracted: "Paired animal-level Wilcoxon signed-rank test; exact p; effect size"
    evidence:
      - RESULT_stat.json: pvalue=0.0625, effect_size=-1.0 (rank-biserial r), statistic=0.0, n_animals=5
      - scipy.stats.wilcoxon(alternative='two-sided', mode='exact')
      - Report states p, r, W, n explicitly; correctly calls p=0.0625 non-significant
    result: PASS

  circular_test_phase_shift:
    contracted: "Circular test for preferred-phase shift (ethanol vs control)"
    evidence: NONE — no circular test implemented or stored in result objects
    finding: >-
      MAJOR-TRACEABILITY-1: The contract (statistical_model) specifies a
      "circular test for preferred-phase shift." No such test was run in P3.
      RESULT_stat.json contains only the Wilcoxon MRL test.
      RESULT_phase.json stores preferred phases descriptively only.
      The report limitation section states: "Per-unit phase-locking values reported
      here are descriptive only; no additional confirmatory hypothesis tests beyond
      the pre-registered animal-level paired comparison are reported."
      This was NOT formally logged as a DEVIATION in result_manifest.yaml.
    resolution_required: >-
      Human sign-off required: (A) accept as documented limitation and close
      as non-critical descriptive-only deviation, OR (B) require circular test
      implementation before final approval.
    result: GAP — AWAITING_HUMAN_DECISION

  fdr_per_unit:
    contracted: "Benjamini-Hochberg FDR across units for per-unit reporting only"
    evidence: NONE — no B-H FDR computed; RESULT_mrl/RESULT_phase contain raw descriptive values only
    finding: >-
      MINOR-TRACEABILITY-1: The contract specifies B-H FDR correction for per-unit
      reporting. Per-unit MRL and preferred phase are reported as descriptive values
      only; no per-unit hypothesis tests were run, so B-H FDR was not applied.
      Not documented as a limitation in the report.
      Assessment: Since no per-unit test was performed, the FDR clause is vacuous
      in this run (nothing to correct). However the contract intended to enable
      per-unit inference, and that was not delivered.
    result: MINOR GAP — documented here; does not block approval

  qc_counts:
    contracted: "Per-experiment n_sniffs / n_neurons / n_trials"
    evidence:
      - RESULT_qc_counts.json: all 6 sessions with n_sniffs, n_neurons, n_trials
      - FIG-DEMO1-QC captions display these values per panel
    result: PASS

  qc_discards:
    contracted: "Per-experiment discarded SNF sections + reason"
    evidence:
      - RESULT_qc_discards.json: per-session discard log (start_s, end_s, reason)
      - FIG-DEMO1-QC shading distinguishes non-sniffing vs noise/short
    result: PASS

  exclusion_reporting:
    contracted: "report_exclusions: true"
    evidence:
      - report_injected.md: 2021-11-03 exclusion documented with reason (ETH_thr>0.11, zero control units)
      - Report states "6 sessions loaded" and "5 animals (5 sessions) in the paired comparison"
    result: PASS

