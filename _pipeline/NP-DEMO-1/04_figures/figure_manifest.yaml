# Limitation note for report (see MAJOR-1 above)
p3_result_gap:
  description: >-
    P3 result objects (RESULT-mrl, RESULT-phase) store per-unit MRL and preferred
    phase. They do NOT store per-spike phase arrays or per-unit phase histograms.
    The contracted FIG-DEMO1-01 y-axis label 'spike rate (norm.) / MRL' implies
    an option to show normalized spike rate tuning curves, which requires per-spike
    phase data. This representation is deferred to a future analysis extension.
  action: >-
    If spike-rate phase tuning curves are required, add per-unit phase histograms
    (e.g., 36-bin circular histograms of spike_SNF_PH per unit per condition) to
    the P3 result objects and re-run the build_figdata + renderer steps.
