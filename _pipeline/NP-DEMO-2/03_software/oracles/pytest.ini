[pytest]
# Discovery-only config (NOT a conftest.py -- no fixtures/hooks live here).
# The task-specified filenames (oracle_*.py) don't match pytest's default
# python_files pattern (test_*.py / *_test.py); without this, a bare
# `pytest` invocation in this directory silently discovers only
# oracle_animal_test.py (the one file that happens to match "*_test.py")
# and skips the other 8 oracle files with no warning. This line makes both
# patterns discoverable.
python_files = oracle_*.py test_*.py
