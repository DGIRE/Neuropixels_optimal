  - id: OPEN-005
    question: >-
      "% time with usable sniffs": sample-count-based or cycle-duration-based?
    resolution: >-
      Cycle-duration-based: pct_usable_sniff_time = (sum of detected
      sniff-cycle durations in seconds) / (total recording duration in
      seconds) × 100.
    blocks_approval: false
    resolved_by: David Gire
